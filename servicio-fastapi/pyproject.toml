[project]
name = "servicio-fastapi-grupo-1"
version = "1.0.0"
description = "API protegida y consola web para los agentes A2A del Grupo 1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integracion: requiere los servidores A2A reales y A2A_INTEGRATION=1",
]
